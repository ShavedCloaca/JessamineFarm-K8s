apiVersion: v1
kind: Namespace
metadata:
  name: jf-web
---
# Hardened NGINX Web Server with Resource Requests for Autoscaling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jf-web-deployment
  namespace: jf-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jf-web
  template:
    metadata:
      labels:
        app: jf-web
    spec:
      containers:
      - name: web
        image: ghcr.io/shavedcloaca/jessamine-farm:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        # Resource requests are required so the HPA knows when CPU exceeds 50%
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: run-volume
          mountPath: /var/run
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: cache-volume
        emptyDir: {}
      - name: run-volume
        emptyDir: {}
---
# EXPOSED Cluster Routing Service
apiVersion: v1
kind: Service
metadata:
  name: jf-web-service
  namespace: jf-web
spec:
  type: ClusterIP
  selector:
    app: jf-web
  ports:
  - port: 80
    targetPort: 8080
---
# Horizontal Pod Autoscaler (Scales from 2 to 10 pods under heavy load)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jf-web-hpa
  namespace: jf-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jf-web-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
# Traefik Ingress Routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jf-web-ingress
  namespace: jf-web
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: "172.16.1.214.sslip.io"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jf-web-service
            port:
              number: 80