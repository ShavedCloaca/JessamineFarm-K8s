apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: "grafana.jessaminefarm.co.uk"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cluster-monitoring-grafana
                port:
                  number: 80